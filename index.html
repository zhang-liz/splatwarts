<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Splatwarts</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: Georgia, serif; }
    canvas { display: block; touch-action: none; outline: none; }
    #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 2px 8px #000; }
    #timer { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); font-size: 56px; font-weight: bold; letter-spacing: 2px; }
    #rings { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); font-size: 28px; }
    #msg { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); font-size: 44px; text-align: center; line-height: 1.3; white-space: pre-line; }
    #hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 16px; opacity: 0.75; text-align: center; }
    #speed { position: absolute; bottom: 20px; right: 24px; font-size: 22px; opacity: 0.85; }
    #loading { position: absolute; top: 12px; left: 16px; font-size: 14px; opacity: 0.7; }
    #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff; opacity: 0.6; }
    #fade { position: fixed; inset: 0; background: #000; opacity: 0; transition: opacity 0.6s; pointer-events: none; }
    #talk { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); width: min(900px, 90vw); text-align: center; }
    #talk .who { font-size: 20px; opacity: 0.8; letter-spacing: 3px; text-transform: uppercase; }
    #talk .line { font-size: 30px; line-height: 1.35; margin-top: 6px; background: rgba(0,0,0,0.45); padding: 12px 20px; border-radius: 10px; }
    #talk .you { font-size: 18px; opacity: 0.7; margin-top: 8px; font-style: italic; }
    #talk input { pointer-events: auto; margin-top: 10px; width: 70%; font: 18px Georgia, serif; padding: 8px 12px; border-radius: 8px; border: 1px solid #888; background: rgba(0,0,0,0.6); color: #fff; }
    #talk .leave { pointer-events: auto; display: block; margin: 10px auto 0; font: 15px Georgia, serif; padding: 6px 14px; border-radius: 8px; border: 1px solid #888; background: rgba(0,0,0,0.5); color: #ddd; cursor: pointer; }
    #talk .leave:hover { background: rgba(255,255,255,0.15); }
    #talk[hidden] { display: none; }
    .listening { color: #ffd166; }
    #spell { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); font-size: 64px; letter-spacing: 6px; font-weight: bold; color: #ffe9a8; text-shadow: 0 0 24px #ffb84d, 0 2px 8px #000; opacity: 0; }
    #spell.pop { animation: pop 1.8s ease-out forwards; }
    @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%) scale(1); } }
    #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(10,8,20,0.55), rgba(0,0,0,0.85)); color: #f3e6c4; text-align: center; transition: opacity 0.8s; z-index: 5; pointer-events: none; }
    #title .name { font-size: 96px; letter-spacing: 14px; font-weight: bold; text-shadow: 0 0 40px #ffb84d, 0 4px 12px #000; }
    #title .sub { font-size: 26px; margin-top: 8px; opacity: 0.9; letter-spacing: 2px; }
    #title .cta { font-size: 20px; margin-top: 40px; opacity: 0.8; animation: blink 1.6s infinite; }
    #title .credits { position: absolute; bottom: 28px; font-size: 14px; opacity: 0.6; max-width: 80vw; }
    #title.gone { opacity: 0; }
    body.intro #msg, body.intro #hint { visibility: hidden; }
    @keyframes blink { 50% { opacity: 0.3; } }
    #listen { position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%); font-size: 15px; opacity: 0.7; color: #ffd166; font-style: italic; }
  </style>
</head>
<body class="intro">
  <canvas id="canvas" tabindex="0"></canvas>
  <div id="hud">
    <div id="timer">0.00</div>
    <div id="rings">0 / 10</div>
    <div id="msg">Click to mount the broom</div>
    <div id="crosshair"></div>
    <div id="speed"></div>
    <div id="loading"></div>
    <div id="talk" hidden>
      <div class="who"></div>
      <div class="line"></div>
      <div class="you"></div>
      <input type="text" placeholder="Type, or hold E and speak" />
      <button class="leave">Walk away (Esc)</button>
    </div>
    <div id="spell"></div>
    <div id="listen"></div>
    <div id="hint"></div>
  </div>
  <div id="fade"></div>
  <div id="title">
    <div class="name">SPLATWARTS</div>
    <div class="sub">Fly it. Land in it. Talk to it. Cast in it.</div>
    <div class="cta">Click to begin</div>
    <div class="credits">Worlds by World Labs Marble from photos of the film's model and set · Rendered and edited live by Spark · Characters by Tripo · Voices by ElevenLabs · Dialogue by Claude</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
